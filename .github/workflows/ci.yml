name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build development image
        run: docker compose build
      - name: Lint, format, and isolated tests
        run: docker compose run --rm test
