# Opt-in component: NOT deployable unchanged. Provide an existing authenticated
# project-scoped agent token in a Secret and an operator-managed TLS CA/endpoint.
# No Secret, identity, TLS endpoint or provider call is created by this file.
# Do not substitute the plain HTTP tessera-control Service for the TLS origin.
# An operator must create a same-namespace TLS gateway Pod/Service with the
# app.kubernetes.io/name=tessera-control-tls label, forwarding to control:8765.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tessera-provider-disabled-coordinator
  namespace: tessera-lab
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tessera-provider-disabled-coordinator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tessera-provider-disabled-coordinator
        tessera.io/tls-control-client: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coordinator
          image: registry.example.invalid/tessera-control:replace-me
          imagePullPolicy: IfNotPresent
          command: ["python", "-c", "from tessera_control.deployment import main; main()"]
          args:
            - --origin
            - https://tessera-control-tls.tessera-lab.svc.cluster.local
            - --ca-file
            - /run/secrets/tessera/ca.crt
            - --credential-file
            - /run/secrets/tessera/agent-token
            - --project-id
            - replace-with-existing-project-id
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: coordinator-credential
              mountPath: /run/secrets/tessera
              readOnly: true
      volumes:
        - name: coordinator-credential
          secret:
            secretName: tessera-existing-coordinator-credential
            defaultMode: 288 # 0440; readable via fsGroup, not environment variables
            items:
              - key: agent-token
                path: agent-token
              - key: ca.crt
                path: ca.crt
---
# Additional egress for this consumer only. The namespace-wide default deny
# remains in place; the operator must secure the gateway and its control hop.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-coordinator-tls-egress
  namespace: tessera-lab
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tessera-provider-disabled-coordinator
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tessera-control-tls
      ports:
        - protocol: TCP
          port: 443
